name: Experimental Android cross-build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: h4ckf0r0day/obscura
          ref: 8534b401898ed17b62f69bdc3d5eb186bffb0d60
          path: upstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Cross-build Android binaries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash ci/cross-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: obscura-termux-aarch64-experimental
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
